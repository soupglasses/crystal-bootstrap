name: Bootstrap source release
run-name: ${{ github.ref_name }}

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: source-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Read Crystal targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      versions: ${{ steps.targets.outputs.versions }}
      llvm: ${{ steps.targets.outputs.llvm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read release.json
        id: targets
        run: |
          python3 - <<'PYTHON'
          import json, os
          config = json.load(open('release.json'))
          versions = [target['version'] for target in config['targets']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps({'crystal': versions}), file=output)
              print('versions=' + ', '.join(versions), file=output)
              print('llvm=' + str(config['llvm_major']), file=output)
          PYTHON

  source:
    name: Crystal ${{ matrix.crystal }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install generation dependencies
        env:
          LLVM_MAJOR: ${{ needs.prepare.outputs.llvm }}
        run: |
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/apt-llvm.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y "llvm-${LLVM_MAJOR}-dev" libgc-dev libpcre2-dev libutf8proc-dev pkg-config
      - name: Check release tools
        run: make check-release
      - name: Generate sources twice and compare
        env:
          CRYSTAL_VERSION: ${{ matrix.crystal }}
          BOOTSTRAP_VERSION: ${{ github.ref_name }}
          LLVM_MAJOR: ${{ needs.prepare.outputs.llvm }}
        run: make generate TARGET="${CRYSTAL_VERSION}" LLVM_CONFIG="llvm-config-${LLVM_MAJOR}"
      - name: Package generated sources
        env:
          TARGET: ${{ matrix.crystal }}
        run: python3 tools/package_source.py "build/generated/${TARGET}"
      - name: Upload source ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crystal-${{ matrix.crystal }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: ${{ github.ref_name }} - Crystal ${{ needs.prepare.outputs.versions }}
    needs: [prepare, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Collect source ZIPs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: crystal-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      - name: Attest source archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ needs.prepare.outputs.versions }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/source.intoto.jsonl
          cat > /tmp/release-notes.md <<EOF_NOTES
          Readable C++ bootstrap sources for Crystal ${TARGET}.

          [Build log](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) · [${GITHUB_SHA:0:7}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})

          Verify the downloaded ZIP with \`gh attestation verify <archive.zip> --repo ${GITHUB_REPOSITORY}\` and \`sha256sum -c SHA256SUMS\`.
          EOF_NOTES
          gh release create "$TAG" --draft --verify-tag --title "${TAG} - Crystal ${TARGET}" --notes-file /tmp/release-notes.md dist/*.zip dist/SHA256SUMS dist/source.intoto.jsonl
          gh release edit "$TAG" --draft=false

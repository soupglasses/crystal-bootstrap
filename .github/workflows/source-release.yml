name: Bootstrap Crystal 1.21.0
run-name: ${{ github.ref_name }} - Crystal 1.21.0

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: source-release
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read release pin
        id: release
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open('release.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('target=' + config['crystal']['version'], file=output)
              print('llvm=' + str(config['llvm_major']), file=output)
          PY
      - name: Install generation dependencies
        env:
          LLVM_MAJOR: ${{ steps.release.outputs.llvm }}
        run: |
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/apt-llvm.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y "llvm-${LLVM_MAJOR}-dev" libgc-dev libpcre2-dev libutf8proc-dev pkg-config
      - name: Check release tools
        run: make check-release
      - name: Generate sources twice and compare
        env:
          BOOTSTRAP_VERSION: ${{ github.ref_name }}
          LLVM_MAJOR: ${{ steps.release.outputs.llvm }}
        run: make generate LLVM_CONFIG="llvm-config-${LLVM_MAJOR}"
      - name: Package generated sources
        env:
          TARGET: ${{ steps.release.outputs.target }}
        run: python3 tools/package_source.py "build/generated/${TARGET}"
      - name: Attest source archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ steps.release.outputs.target }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/source.intoto.jsonl
          cat > /tmp/release-notes.md <<EOF_NOTES
          Readable C++ bootstrap sources for Crystal ${TARGET}.

          [Build log](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) · [${GITHUB_SHA:0:7}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})

          Verify the downloaded ZIP with \`gh attestation verify <archive.zip> --repo ${GITHUB_REPOSITORY}\` and \`sha256sum -c SHA256SUMS\`.
          EOF_NOTES
          gh release create "$TAG" --draft --verify-tag --title "${TAG} - Crystal ${TARGET}" --notes-file /tmp/release-notes.md dist/*.zip dist/SHA256SUMS dist/source.intoto.jsonl
          gh release edit "$TAG" --draft=false
